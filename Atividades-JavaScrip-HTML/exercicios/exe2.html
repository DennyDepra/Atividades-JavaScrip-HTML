<!DOCTYPE html>
<html lang="pt-br">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>EXERCICIO 01</title>
        </head>
        <body>
            <h3>TROCA DE CONTEÚDO ENTRE VARIÁVEIS</h3>
            <p>Crie um programa que armazene o valor de duas variáveis e troque o conteúdo entre elas.</p>
            <form onsubmit="executar(event)"" onreset="resetar()">
                <label for="varA">Informe o valor da da variável "A":</label><br>

                <input id="varA" type = "number" min = "1" step="1" required></label>

                <br><br>
                <label for="varB">Informe o valor da variável "B":</label><br>

                <input id="varB" type = "number" min = "1" step="1" required></label>

                <br><br>
                <label id="IDresultadoA"></label><br><br>
                <label id="IDresultadoB"></label><br><br>


                <button type="submit">VERIFICAR</button>
                <button type="reset">LIMPAR</button>
                <button type="button" onclick="retornar()">RETORNAR</button>
            </form>

            <script src="../JavaS/comum.js"></script>
            <script src="../JavaS/exe02.js"></script>

        </body>
</html>
